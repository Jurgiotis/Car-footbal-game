<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Car Football</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #101923;
      color: white;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 2;
      background: #102030cc;
      padding: 12px 16px;
      border-radius: 10px;
      line-height: 1.6;
    }

    #boostOuter {
      width: 180px;
      height: 15px;
      background: #333;
      border: 1px solid white;
      border-radius: 8px;
      overflow: hidden;
    }

    #boostBar {
      width: 100%;
      height: 100%;
      background: #35caff;
    }

    #menu {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #101923ee;
      text-align: center;
      padding: 20px;
    }

    #menu h1 {
      font-size: 42px;
      margin-bottom: 5px;
    }

    #cars {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      max-width: 700px;
      margin-top: 16px;
    }

    button {
      color: white;
      border: 3px solid white;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.25);
      transform: scale(1.04);
    }
  </style>
</head>
<body>
  <div id="hud">
    <strong>3D Car Football</strong><br>
    <span id="score">0 - 0</span> &nbsp; <span id="timer">Time: 90</span><br>
    Boost
    <div id="boostOuter"><div id="boostBar"></div></div>
    Drive: W/S or ↑/↓ &nbsp; Turn: A/D or ←/→ &nbsp; Boost: Space
  </div>

  <div id="menu">
    <h1 id="menuTitle">3D Car Football</h1>
    <p id="menuText">Choose a car to start. Score in the blue goal!</p>
    <div id="cars"></div>
  </div>

  <script type="module">
    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 90, 180);

    const camera = new THREE.PerspectiveCamera(
      65, window.innerWidth / window.innerHeight, 0.1, 300
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x506040, 2));

    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.position.set(-25, 45, 25);
    sun.castShadow = true;
    scene.add(sun);

    const fieldWidth = 80;
    const fieldDepth = 50;
    const goalHalfWidth = 7;

    // Grass field
    const grass = new THREE.Mesh(
      new THREE.PlaneGeometry(fieldWidth, fieldDepth),
      new THREE.MeshStandardMaterial({ color: 0x278447, roughness: 0.9 })
    );
    grass.rotation.x = -Math.PI / 2;
    grass.receiveShadow = true;
    scene.add(grass);

    // Field markings
    function line(x, z, width, depth) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(width, 0.04, depth),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      mesh.position.set(x, 0.03, z);
      scene.add(mesh);
    }

    line(0, 0, 0.15, fieldDepth);
    line(-fieldWidth / 2, 0, 0.2, fieldDepth);
    line(fieldWidth / 2, 0, 0.2, fieldDepth);
    line(0, -fieldDepth / 2, fieldWidth, 0.2);
    line(0, fieldDepth / 2, fieldWidth, 0.2);

    const centerCircle = new THREE.Mesh(
      new THREE.RingGeometry(7.7, 8, 48),
      new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
    );
    centerCircle.rotation.x = -Math.PI / 2;
    centerCircle.position.y = 0.04;
    scene.add(centerCircle);

    // Goals: the player scores at the right-hand goal.
    function makeGoal(x, color) {
      const material = new THREE.MeshStandardMaterial({ color });

      for (const z of [-goalHalfWidth, goalHalfWidth]) {
        const post = new THREE.Mesh(
          new THREE.BoxGeometry(1, 5, 0.6), material
        );
        post.position.set(x, 2.5, z);
        post.castShadow = true;
        scene.add(post);
      }

      const bar = new THREE.Mesh(
        new THREE.BoxGeometry(1, 0.6, goalHalfWidth * 2),
        material
      );
      bar.position.set(x, 5, 0);
      bar.castShadow = true;
      scene.add(bar);

      const back = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 5, goalHalfWidth * 2),
        new THREE.MeshStandardMaterial({
          color,
          transparent: true,
          opacity: 0.25
        })
      );
      back.position.set(x + (x > 0 ? 4 : -4), 2.5, 0);
      scene.add(back);
    }

    makeGoal(-fieldWidth / 2, 0xff5555);
    makeGoal(fieldWidth / 2, 0x3399ff);

    // Big football
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(1.5, 24, 18),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.65 })
    );
    ball.position.set(0, 1.5, 0);
    ball.castShadow = true;
    scene.add(ball);

    const ballVelocity = new THREE.Vector3();

    function makeCar(color) {
      const car = new THREE.Group();
      const paint = new THREE.MeshStandardMaterial({
        color,
        metalness: 0.25,
        roughness: 0.4
      });
      const dark = new THREE.MeshStandardMaterial({ color: 0x17202a });
      const glass = new THREE.MeshStandardMaterial({
        color: 0x9fe5ff,
        metalness: 0.2,
        roughness: 0.2
      });

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(4.2, 1.2, 2.3), paint
      );
      body.position.y = 1.1;
      body.castShadow = true;
      car.add(body);

      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(2.1, 1, 1.8), glass
      );
      cabin.position.set(-0.2, 2, 0);
      cabin.castShadow = true;
      car.add(cabin);

      // Four wheels
      for (const x of [-1.25, 1.25]) {
        for (const z of [-1.25, 1.25]) {
          const wheel = new THREE.Mesh(
            new THREE.CylinderGeometry(0.55, 0.55, 0.35, 16),
            dark
          );
          wheel.rotation.x = Math.PI / 2;
          wheel.position.set(x, 0.65, z);
          wheel.castShadow = true;
          car.add(wheel);
        }
      }

      // Bright nose shows which way the car is facing.
      const nose = new THREE.Mesh(
        new THREE.BoxGeometry(0.35, 0.35, 0.5), dark
      );
      nose.position.set(2.1, 1.2, 0);
      car.add(nose);

      scene.add(car);
      return car;
    }

    const carChoices = [
      { name: "Racer", color: 0xff5555, speed: 25 },
      { name: "Turbo", color: 0x3399ff, speed: 29 },
      { name: "Drifter", color: 0x55dd77, speed: 26 },
      { name: "Storm", color: 0xffcc33, speed: 31 },
      { name: "Titan", color: 0xaa66ff, speed: 23 }
    ];

    let player;
    let enemy;
    let playerSpeed = 25;
    let boost = 100;
    let playerScore = 0;
    let enemyScore = 0;
    let timeLeft = 90;
    let playing = false;

    const keys = {};
    const menu = document.getElementById("menu");
    const menuTitle = document.getElementById("menuTitle");
    const menuText = document.getElementById("menuText");

    function showCarButtons() {
      const carBox = document.getElementById("cars");
      carBox.innerHTML = "";

      for (const choice of carChoices) {
        const button = document.createElement("button");
        button.textContent = choice.name;
        button.style.background = "#" + choice.color.toString(16).padStart(6, "0");
        button.onclick = () => startGame(choice);
        carBox.appendChild(button);
      }
    }

    function resetPositions() {
      player.position.set(-22, 0, 0);
      player.rotation.y = 0;

      enemy.position.set(22, 0, 0);
      enemy.rotation.y = Math.PI;

      ball.position.set(0, 1.5, 0);
      ballVelocity.set(0, 0, 0);
    }

    function startGame(choice) {
      if (player) scene.remove(player);
      if (enemy) scene.remove(enemy);

      player = makeCar(choice.color);
      enemy = makeCar(0xff7733);
      playerSpeed = choice.speed;

      playerScore = 0;
      enemyScore = 0;
      timeLeft = 90;
      boost = 100;
      playing = true;

      resetPositions();
      menu.style.display = "none";
      updateHud();
    }

    showCarButtons();

    window.addEventListener("keydown", (event) => {
      keys[event.key.toLowerCase()] = true;
      if (event.key.startsWith("Arrow") || event.key === " ") {
        event.preventDefault();
      }
    });

    window.addEventListener("keyup", (event) => {
      keys[event.key.toLowerCase()] = false;
    });

    function moveCar(car, forward, turn, speed, dt) {
      if (forward !== 0) {
        car.rotation.y += turn * dt * 2.4 * (forward < 0 ? -1 : 1);
      }

      const direction = new THREE.Vector3(
        Math.cos(car.rotation.y), 0, -Math.sin(car.rotation.y)
      );

      car.position.addScaledVector(direction, forward * speed * dt);

      car.position.x = THREE.MathUtils.clamp(
        car.position.x, -fieldWidth / 2 + 3, fieldWidth / 2 - 3
      );
      car.position.z = THREE.MathUtils.clamp(
        car.position.z, -fieldDepth / 2 + 3, fieldDepth / 2 - 3
      );

      return direction;
    }

    function hitBall(car, power) {
      const dx = ball.position.x - car.position.x;
      const dz = ball.position.z - car.position.z;
      const distance = Math.hypot(dx, dz);
      const touchDistance = 4.4;

      if (distance < touchDistance) {
        const nx = dx / (distance || 1);
        const nz = dz / (distance || 1);
        ball.position.x = car.position.x + nx * touchDistance;
        ball.position.z = car.position.z + nz * touchDistance;
        ballVelocity.x += nx * power;
        ballVelocity.z += nz * power;
        ballVelocity.y += 2;
      }
    }

    function updateHud() {
      document.getElementById("score").textContent =
        `${playerScore} - ${enemyScore}`;
      document.getElementById("timer").textContent =
        `Time: ${Math.ceil(timeLeft)}`;
      document.getElementById("boostBar").style.width = `${boost}%`;
    }

    function scoreGoal(playerScored) {
      if (playerScored) playerScore++;
      else enemyScore++;

      resetPositions();
      updateHud();
    }

    function finishGame() {
      playing = false;
      menuTitle.textContent = "Time's up!";
      menuText.textContent =
        `Final score: ${playerScore} - ${enemyScore}. Choose a car to play again!`;
      menu.style.display = "flex";
    }

    function update(dt) {
      if (!playing) return;

      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        finishGame();
        return;
      }

      let forward = 0;
      let turn = 0;

      if (keys.w || keys.arrowup) forward = 1;
      if (keys.s || keys.arrowdown) forward = -0.65;
      if (keys.a || keys.arrowleft) turn = 1;
      if (keys.d || keys.arrowright) turn = -1;

      const boosting = keys[" "] && boost > 0 && forward > 0;
      const speed = playerSpeed * (boosting ? 1.7 : 1);

      if (boosting) boost = Math.max(0, boost - 35 * dt);
      else boost = Math.min(100, boost + 18 * dt);

      const playerDirection = moveCar(player, forward, turn, speed, dt);
      hitBall(player, boosting ? 34 : 24);

      // Simple opponent: turn toward the ball and drive at it.
      const toBallX = ball.position.x - enemy.position.x;
      const toBallZ = ball.position.z - enemy.position.z;
      const targetAngle = Math.atan2(-toBallZ, toBallX);
      let angleDifference = targetAngle - enemy.rotation.y;
      angleDifference = Math.atan2(
        Math.sin(angleDifference), Math.cos(angleDifference)
      );

      enemy.rotation.y += THREE.MathUtils.clamp(
        angleDifference, -2 * dt, 2 * dt
      );
      moveCar(enemy, 1, 0, 19, dt);
      hitBall(enemy, 22);

      // Ball movement, gravity, and bounce.
      ball.position.x += ballVelocity.x * dt;
      ball.position.z += ballVelocity.z * dt;
      ball.position.y += ballVelocity.y * dt;

      ballVelocity.y -= 18 * dt;
      ballVelocity.x *= Math.pow(0.985, dt * 60);
      ballVelocity.z *= Math.pow(0.985, dt * 60);

      if (ball.position.y < 1.5) {
        ball.position.y = 1.5;
        ballVelocity.y = Math.abs(ballVelocity.y) * 0.65;
      }

      const halfX = fieldWidth / 2;
      const halfZ = fieldDepth / 2;

      if (ball.position.z < -halfZ + 1.5 ||
          ball.position.z > halfZ - 1.5) {
        ball.position.z = THREE.MathUtils.clamp(
          ball.position.z, -halfZ + 1.5, halfZ - 1.5
        );
        ballVelocity.z *= -0.75;
      }

      // Goals are at the left and right ends.
      if (ball.position.x > halfX &&
          Math.abs(ball.position.z) < goalHalfWidth &&
          ball.position.y < 5) {
        scoreGoal(true);
      } else if (ball.position.x < -halfX &&
          Math.abs(ball.position.z) < goalHalfWidth &&
          ball.position.y < 5) {
        scoreGoal(false);
      } else {
        // Bounce off the end walls when not inside a goal.
        if (ball.position.x > halfX - 1.5 &&
            Math.abs(ball.position.z) >= goalHalfWidth) {
          ball.position.x = halfX - 1.5;
          ballVelocity.x *= -0.75;
        }

        if (ball.position.x < -halfX + 1.5 &&
            Math.abs(ball.position.z) >= goalHalfWidth) {
          ball.position.x = -halfX + 1.5;
          ballVelocity.x *= -0.75;
        }
      }

      // Follow behind the player's car.
      const behind = new THREE.Vector3(
        -Math.cos(player.rotation.y), 0, Math.sin(player.rotation.y)
      );

      const cameraTarget = player.position.clone();
      cameraTarget.y += 2;

      const cameraPosition = player.position.clone()
        .addScaledVector(behind, 13);
      cameraPosition.y += 8;
      camera.position.lerp(cameraPosition, 1 - Math.pow(0.001, dt));
      camera.lookAt(cameraTarget);

      updateHud();
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.04);

      update(dt);
      renderer.render(scene, camera);
    }

    const clock = new THREE.Clock();

    // Starting view before a car is selected.
    camera.position.set(-35, 35, 45);
    camera.lookAt(0, 0, 0);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
